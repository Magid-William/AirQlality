name: Release

# A tag is the release trigger (EXP26): `git tag -a v0.1.0 -m "<notes>"` then
# `git push origin v0.1.0`. The tag annotation becomes the release notes, so the
# story of a build lives in git next to the commit it describes, not only on the
# website. `workflow_dispatch` re-publishes an existing tag (clobbering assets).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  release:
    name: build and publish ${{ github.ref_name }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: `--notes-from-tag` reads the annotated tag object.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # A release must never carry a version the crate does not claim. The tag is
      # the single source of truth; `Cargo.toml` has to agree or we stop here.
      - name: tag matches Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'.Trim()
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag '$tag' is not v<major>.<minor>.<patch>" }
          $ver = $Matches[1]
          $manifest = Get-Content Cargo.toml -Raw
          $declared = [regex]::Match($manifest, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $declared) { throw 'no version in [workspace.package]' }
          if ($declared -ne $ver) { throw "tag says $ver, Cargo.toml says $declared - bump one of them" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release $tag (version $ver) agrees with Cargo.toml"

      - name: Put MinGW on PATH
        shell: pwsh
        run: |
          $candidates = 'C:\mingw64\bin', 'C:\msys64\mingw64\bin', 'C:\msys64\ucrt64\bin'
          $mingw = $candidates | Where-Object {
            (Test-Path (Join-Path $_ 'gcc.exe')) -and (Test-Path (Join-Path $_ 'windres.exe'))
          } | Select-Object -First 1
          if (-not $mingw) {
            throw "no MinGW with gcc.exe + windres.exe in: $($candidates -join ', ')"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "using $mingw"

      - name: Install the pinned GNU toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Never ship from a red tree, even if CI was green on an earlier commit.
      - name: core tests
        run: cargo test -p airqlality-core

      - name: app unit tests
        run: cargo test -p airqlality --bin airqlality

      # `--profile dist`, not `--release`: only the dist profile lets
      # `gpui_ce_windows` run fxc.exe here and embed the HLSL bytecode, which is
      # what makes the exe portable off this runner (see Cargo.toml).
      - name: dist build
        run: cargo build -p airqlality --profile dist

      # The EXP14 icon only exists inside `OUT_DIR` (build.rs writes it for
      # `windres`), so write the same bytes to a real file for Inno Setup.
      # Dev-profile deps are warm from the unit-test steps, so this is cheap.
      - name: write the setup icon
        run: cargo run -p airqlality --example emit_icon -- target\AirQlality.ico

      # Inno Setup is NOT on the windows-2025 image (unlike windows-2022), so
      # install it. ~7 MiB, once per run, on the runner.
      - name: install Inno Setup
        shell: pwsh
        run: |
          $candidates = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
                        'C:\Program Files\Inno Setup 6\ISCC.exe'
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "using $iscc"

      # One script, two assets: the portable zip below and this setup. The tag's
      # version is the only version (validated in the first step).
      - name: build the setup
        id: setup
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          & $env:ISCC "/DAppVersion=$ver" `
            "/DSourceExe=$PWD\target\dist\airqlality.exe" `
            "/DSourceIcon=$PWD\target\AirQlality.ico" `
            installer\airqlality.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $setup = Join-Path 'dist' "AirQlality-v$ver-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          "setup=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_mb=$mb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "built $setup ($mb MiB)"

      # Black-box: silent per-user install into a scratch dir, one ARP entry after
      # an upgrade, silent uninstall that leaves no exe, shortcut, ARP entry or
      # autostart value behind - and keeps the user's settings.
      - name: prove the installer
        shell: pwsh
        run: |
          installer\proof.ps1 -Setup '${{ steps.setup.outputs.setup }}'
          if ($LASTEXITCODE -ne 0) { throw "installer proof failed" }

      - name: package the zip
        id: zip
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $name = "AirQlality-v$ver-windows-x64"
          $stage = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target\dist\airqlality.exe' $stage
          foreach ($doc in 'README.md', 'LICENSE', 'NOTICE') {
            if (-not (Test-Path $doc)) { throw "missing $doc" }
            Copy-Item $doc $stage
          }
          $zip = Join-Path 'dist' "$name.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $setup = Get-Item '${{ steps.setup.outputs.setup }}'
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          @(
            "$hash  $name.zip"
            "$setupHash  $($setup.Name)"
          ) | Set-Content -Path 'dist\SHA256SUMS.txt' -Encoding ascii
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          "asset=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_sha256=$setupHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "packaged $name.zip ($mb MiB, sha256 $hash) + $($setup.Name) (sha256 $setupHash)"

      - name: publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $title = 'AirQlality ' + '${{ steps.ver.outputs.version }}'
          $assets = @('${{ steps.setup.outputs.setup }}', '${{ steps.zip.outputs.asset }}', 'dist\SHA256SUMS.txt')
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            # Re-run of the same tag: replace the assets and notes, never fail on
            # "release already exists".
            gh release edit $tag --title $title --notes-from-tag
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title $title --notes-from-tag --latest
          }
          gh release view $tag --json tagName,url,assets --jq '"released \(.tagName) -> \(.url)"'

      - name: summary
        shell: pwsh
        run: |
          @"
          **${{ steps.zip.outputs.name }}-setup.exe** - ${{ steps.setup.outputs.setup_mb }} MiB
          sha256 ${{ steps.zip.outputs.setup_sha256 }}

          **${{ steps.zip.outputs.name }}.zip**
          sha256 ${{ steps.zip.outputs.sha256 }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
