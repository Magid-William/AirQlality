[workspace]
resolver = "2"
members = ["core", "app"]

# The EXP0N spikes are standalone packages; keep the workspace out of them.
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
airqlality-core = { path = "core" }
chrono = "0.4"
# JSON for the Open-Meteo response (real data source, EXP06).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTPS client for `OpenMeteoSource`. `native-tls` uses the Windows
# schannel stack (no C toolchain, unlike rustls/ring) on this GNU/MinGW build.
# ureq never enables a TLS backend by default, so we also depend on `native-tls`
# directly and hand the connector to the agent (see `openmeteo.rs`).
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
# `gpui-ce` is core-only; its lib name is `gpui`, so alias it for `use gpui::...`.
gpui = { package = "gpui-ce", version = "0.2", default-features = false }
# The app entry point (`application()`) + the Windows backend (wgpu on Windows).
gpui_platform = { package = "gpui_ce_platform", version = "0.1" }

[profile.release]
# Evaluation build: optimized, no debug info, symbols stripped.
debug = false
debug-assertions = false
strip = true

# `gpui_ce_windows` precompiles its DirectX HLSL shaders with `fxc.exe` from the
# Windows SDK whenever debug-assertions are off. This machine has no Windows SDK
# (and no admin to install one), so keep debug-assertions on for THIS CRATE ONLY:
# it then compiles the shaders at runtime via D3DCompileFromFile. Everything else
# (our app, `core`, all other deps) remains a normal optimized release.
[profile.release.package.gpui_ce_windows]
debug-assertions = true
